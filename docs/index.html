<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EcoSort — Smart Waste Sorting Game</title>
    <meta
      name="description"
      content="EcoSort adalah game edukasi memilah sampah: kenali jenis sampah, pilih tempat yang tepat, dan kumpulkan poin. Sort It Right, Keep Earth Bright!"
    />
    <meta name="theme-color" content="#F7F8F4" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23176747'/%3E%3Cpath d='M33 49c-8-4-13-11-13-20 8-1 14 2 18 8 1-7 5-12 12-14 1 13-5 22-17 26z' fill='%23D7F36A'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Warna dasar + tampilan awal agar halaman tidak kosong bila JavaScript gagal dimuat. */
      html { background: #f7f8f4; }
      html[data-theme="dim"] { background: #131a17; }
      body { margin: 0; }
      .boot-screen {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #202b27;
        font-family: Inter, system-ui, sans-serif;
      }
      .boot-card {
        width: min(100%, 520px);
        padding: 28px;
        border: 1px solid #e4eae5;
        border-radius: 24px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 18px 55px rgba(32, 43, 39, .09);
        text-align: center;
      }
      .boot-mark {
        display: grid;
        width: 48px;
        height: 48px;
        margin: 0 auto;
        place-items: center;
        border-radius: 15px;
        background: #176747;
        color: #d7f36a;
        font-size: 25px;
      }
      .boot-card h1 { margin: 18px 0 8px; font-size: 24px; letter-spacing: -.04em; text-align: center; }
      .boot-card p, .boot-card li { color: #59665f; line-height: 1.6; }
      .boot-card p { margin: 0; text-align: center; }
      .boot-card details { margin-top: 18px; padding-top: 16px; border-top: 1px solid #e4eae5; text-align: left; }
      .boot-card summary { color: #176747; font-weight: 700; cursor: pointer; }
      .boot-card ol { padding-left: 22px; margin-bottom: 0; }
      .boot-card code { padding: 2px 5px; border-radius: 5px; background: #eff2ec; color: #202b27; }
      .boot-card a { color: #176747; }
      /* Baris kemajuan kecil supaya layar awal terasa hidup. */
      .boot-bar {
        width: 168px;
        height: 5px;
        margin: 20px auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: #e4eae5;
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #176747;
      }
      @media (prefers-reduced-motion: no-preference) {
        .boot-mark { animation: boot-bob 1.4s ease-in-out infinite alternate; }
        .boot-bar span { animation: boot-slide 1.25s ease-in-out infinite; }
        @keyframes boot-bob { to { transform: translateY(-4px); } }
        @keyframes boot-slide {
          0% { transform: translateX(-110%); }
          100% { transform: translateX(360%); }
        }
      }
      [hidden] { display: none !important; }
    </style>

name:"Kulit Pisang",category:"organik",emoji:"🍌",description:"Kulit buah pisang setelah buahnya dimakan.",fact:"Kulit pisang kaya kalium sehingga sering dipakai sebagai bahan kompos atau eco-enzyme.",handling:"Kumpulkan di wadah tertutup, lalu komposkan atau serahkan ke pengelola kompos.",difficulty:1,reason:"Kulit buah termasuk sampah organik yang mudah terurai secara biologis.",wrongHint:"Kulit pisang akan membusuk dalam hitungan hari. Membuangnya ke jalur daur ulang atau residu membuat potensi komposnya hilang.",tags:["buah","kompos","kulit","basah"]},{id:"org-sisa-nasi",name:"Sisa Nasi & Lauk",category:"organik",emoji:"🍚",description:"Nasi, lauk, atau makanan matang yang tersisa di piring.",fact:"Sisa makanan adalah salah satu penyumbang terbesar sampah rumah tangga; mengurangi porsi ambil adalah cara paling hemat.",handling:"Pisahkan dari tulang besar dan kemasan, tiriskan, lalu masukkan wadah kompos tertutup agar tidak mengundang lalat.",difficulty:1,reason:"Sisa makanan dapat terurai dan diolah menjadi kompos atau pakan ternak pada kondisi yang sesuai.",wrongHint:"Makanan basah akan merusak kertas dan plastik di jalur daur ulang. Tempat yang tepat adalah wadah organik.",tags:["makanan","kompos","dapur","basah"]},{id:"org-daun-kering",name:"Daun & Ranting Kering",category:"organik",emoji:"🍂",description:"Daun gugur, rumput potongan, dan ranting kecil dari halaman.",fact:"Daun kering adalah sumber karbon yang bagus untuk menyeimbangkan kompos dari sisa dapur yang kaya nitrogen.",handling:"Kumpulkan, cacah bila perlu, lalu campur ke tumpukan kompos atau jadikan pupuk daun.",difficulty:1,reason:"Daun dan ranting adalah material tumbuhan yang terurai alami di tanah.",wrongHint:"Sampah halaman tidak bisa didaur ulang jadi produk baru. Membakarnya juga bukan solusi karena menghasilkan asap.",tags:["kebun","halaman","kompos","kering"]},{id:"org-ampas-kopi",name:"Ampas Kopi (tanpa sachet)",category:"organik",emoji:"☕",description:"Endapan bubuk kopi setelah diseduh, tanpa kemasan plastiknya.",fact:"Ampas kopi dapat membantu menggemburkan tanah dan mengurangi bau pada wadah kompos.",handling:"Tiriskan, keringkan sebentar, lalu campurkan ke kompos atau media tanam.",difficulty:2,reason:"Bubuk kopi adalah bahan hayati yang terurai dan cocok untuk kompos.",wrongHint:"Ampas kopi bukan bahan daur ulang. Yang perlu diwaspadai adalah sachet kopinya: kemasan berlapis itu masuk residu.",tags:["kopi","kompos","ampas","dapur"]},{id:"org-cangkang-telur",name:"Cangkang Telur",category:"organik",emoji:"🥚",description:"Pecahan kulit telur sisa memasak.",fact:"Cangkang telur mengandung kalsium karbonat yang membantu memperbaiki tanah kebun.",handling:"Bilas dan keringkan, remukkan, lalu campur ke kompos atau taburkan di media tanam.",difficulty:2,reason:"Cangkang telur berasal dari makhluk hidup dan terurai secara biologis, meski lebih lambat dari sisa sayur.",wrongHint:"Cangkang telur tidak bisa dilelehkan atau dipulpa seperti kemasan. Jalur yang tepat adalah kompos.",tags:["telur","kompos","dapur","kalsium"]},{id:"org-kulit-jeruk",name:"Kulit Jeruk & Buah",category:"organik",emoji:"🍊",description:"Kulit jeruk, apel, mangga, dan buah lain yang dikupas.",fact:"Kulit jeruk bisa difermentasi menjadi eco-enzyme atau pengharum alami, selain dikomposkan.",handling:"Kumpulkan terpisah, keringkan bila ingin dijadikan eco-enzyme, atau langsung komposkan.",difficulty:1,reason:"Kulit buah adalah sampah organik yang mudah terurai dan bermanfaat untuk kompos.",wrongHint:"Kulit buah akan membusuk, bukan diolah ulang menjadi barang. Jadi tempatnya di wadah organik.",tags:["buah","jeruk","kompos","eco-enzyme"]},{id:"org-tulang-kecil",name:"Tulang Ayam & Duri Ikan",category:"organik",emoji:"🍗",description:"Sisa tulang kecil dan duri dari makanan.",fact:"Tulang terurai jauh lebih lama daripada sisa sayur, sehingga di fasilitas kompos kota sering diminta dihancurkan terlebih dulu.",handling:"Untuk skala rumah, kumpulkan terpisah dan kubur di lubang biopori; di lingkungan kampus, ikuti arahan pengelola sampah organik setempat.",difficulty:3,reason:"Tulang dan duri berasal dari makhluk hidup sehingga termasuk organik, meski penguraiannya lambat.",wrongHint:"Tulang bukan kemasan sehingga tidak bisa didaur ulang. Di game ini tulang kecil masuk kategori organik.",tags:["tulang","ikan","ayam","kompos"]},{id:"rec-botol-pet",name:"Botol Plastik PET (kosong & bersih)",category:"daurulang",emoji:"🧴",description:"Botol air mineral bening berkode PET/1 yang sudah dikosongkan dan dibilas.",fact:"PET adalah jenis plastik yang paling banyak diterima bank sampah; botol bekasnya bisa diolah jadi serat pakaian atau botol baru.",handling:"Kosongkan, bilas, lepaskan label bila diminta pengepul, lalu pipihkan dan kumpulkan terpisah dari sampah basah.",difficulty:1,reason:"Botol PET yang bersih dan kering termasuk bahan yang paling umum diterima fasilitas daur ulang.",wrongHint:"Botol plastik bersih masih punya nilai jual. Membuangnya ke residu berarti membuang bahan yang bisa diproses ulang.",tags:["plastik","botol","pet","bank sampah"]},{id:"rec-kaleng-minuman",name:"Kaleng Minuman Aluminium",category:"daurulang",emoji:"🥫",description:"Kaleng soda atau minuman ringan berbahan aluminium, sudah kosong.",fact:"Aluminium dapat didaur ulang berulang kali; mendaur ulang satu kaleng menghemat energi jauh lebih besar dibanding membuatnya dari bijih baru.",handling:"Kosongkan, bilas, pipihkan bila memungkinkan, dan kumpulkan terpisah dari sampah basah.",difficulty:1,reason:"Logam seperti aluminium punya nilai daur ulang tinggi dan diterima hampir semua pengepul.",wrongHint:"Kaleng aluminium bukan residu. Jika dibuang tercampur, logam yang mudah didaur ulang ini ikut terkubur.",tags:["logam","aluminium","kaleng","minuman"]},{id:"rec-botol-kaca",name:"Botol Kaca (bekas sirup/saus)",category:"daurulang",emoji:"🍾",description:"Botol atau toples kaca yang masih utuh, sudah dicuci.",fact:"Kaca dapat dilelehkan dan dibentuk ulang tanpa kehilangan kualitas, dan di banyak tempat botol utuh bisa dipakai kembali.",handling:"Cuci, keringkan, simpan terpisah agar tidak pecah, lalu serahkan ke bank sampah atau pengepul kaca.",difficulty:2,reason:"Kaca bersih termasuk bahan yang bisa dilelehkan dan dibentuk ulang oleh fasilitas daur ulang.",wrongHint:"Kaca tidak terurai di alam sehingga bukan organik, dan nilainya terlalu tinggi untuk dibuang sebagai residu.",tags:["kaca","botol","beling","sirup"]},{id:"rec-kardus-bersih",name:"Kardus Bersih & Kering",category:"daurulang",emoji:"📦",description:"Kotak paket atau kardus yang tidak terkena minyak maupun cairan.",fact:"Serat kertas kardus bisa dipulpa dan dijadikan kertas baru; kardus adalah salah satu material yang paling banyak didaur ulang di dunia.",handling:"Lepaskan selotip dan bubble wrap, lipat agar ringkas, simpan di tempat kering.",difficulty:1,reason:"Kardus bersih dan kering mudah dipulpa sehingga diterima di hampir semua jalur daur ulang kertas.",wrongHint:"Kardus yang masih bersih jangan dibuang ke residu. Justru nilai jualnya cukup tinggi di bank sampah.",tags:["kardus","kertas","karton","paket"]},{id:"rec-kertas-hvs",name:"Kertas HVS & Buku Tulis",category:"daurulang",emoji:"📄",description:"Kertas cetak, dokumen lama, dan buku tulis tanpa sampul plastik.",fact:"Satu ton kertas bekas yang didaur ulang menyelamatkan banyak pohon dan memakai air lebih sedikit dibanding membuat kertas baru.",handling:"Lepaskan sampul plastik, klip, dan spiral; tumpuk rapi dan jaga agar tidak basah.",difficulty:1,reason:"Kertas bersih tanpa lapisan plastik dapat dipulpa kembali menjadi kertas baru.",wrongHint:"Kertas kering dan tidak berminyak masih sangat layak didaur ulang, jadi jangan masuk residu.",tags:["kertas","hvs","buku","kampus"]},{id:"rec-koran",name:"Koran & Majalah Lama",category:"daurulang",emoji:"📰",description:"Tumpukan koran, majalah, atau brosur yang sudah tidak dibaca.",fact:"Koran termasuk kertas berkualitas baik untuk didaur ulang, dan sering dipakai sebagai lapisan alas wadah kompos.",handling:"Ikat per tumpuk, jaga tetap kering, lalu serahkan ke bank sampah atau pengepul kertas.",difficulty:1,reason:"Koran adalah kertas bersih yang mudah dipulpa ulang.",wrongHint:"Koran kering tidak boleh dibuang ke residu; ikat dan jual/serahkan agar jadi kertas baru.",tags:["koran","majalah","kertas","baca"]},{id:"rec-botol-hdpe",name:"Botol Sabun/Sampo HDPE (bersih)",category:"daurulang",emoji:"🧼",description:"Botol plastik tebal berkode HDPE/2 bekas sabun atau sampo, sudah dibilas.",fact:"HDPE banyak diterima pengepul dan dapat diolah menjadi ember, palet, atau botol non-makanan.",handling:"Habiskan isinya, bilas, keringkan, lalu kumpulkan bersama plastik lain yang bersih.",difficulty:2,reason:"Botol HDPE yang sudah dibilas termasuk plastik bernilai yang diterima fasilitas daur ulang.",wrongHint:"Selama botolnya bersih, ia masih layak didaur ulang. Residu hanya untuk kemasan yang kotor atau berlapis banyak bahan.",tags:["plastik","hdpe","sabun","sampo"]},{id:"rec-kaleng-biskuit",name:"Kaleng Biskuit / Kemasan Logam",category:"daurulang",emoji:"🍪",description:"Kaleng biskuit, kaleng susu, atau wadah logam yang sudah kosong dan tidak berkarat parah.",fact:"Logam baja dan aluminium bisa didaur ulang berkali-kali; kaleng biskuit juga sering dipakai ulang sebagai wadah oleh keluarga di Indonesia.",handling:"Kosongkan, bersihkan sisa remah, tutup rapat bila ingin dipakai ulang, atau serahkan ke pengepul logam.",difficulty:2,reason:"Wadah logam termasuk material daur ulang yang bernilai dan mudah dilebur ulang.",wrongHint:"Kaleng logam bukan residu. Bersihkan dulu, lalu masukkan ke jalur daur ulang logam.",tags:["logam","kaleng","biskuit","susu"]},{id:"res-tisu-bekas",name:"Tisu Bekas (kotor/lembap)",category:"residu",emoji:"🧻",description:"Tisu yang sudah dipakai mengelap mulut, tangan, atau tumpahan.",fact:"Serat tisu sangat pendek dan sudah terkontaminasi, sehingga tidak laku di jalur daur ulang kertas.",handling:"Buang ke tempat sampah residu; bila dipakai untuk cairan kimia, serahkan lewat jalur sampah khusus.",difficulty:1,reason:"Tisu kotor dan basah tidak bisa dipulpa ulang dan tidak layak dikomposkan di jalur kota.",wrongHint:"Kertas yang sudah kotor tidak sama dengan kertas daur ulang. Tisu bekas masuk residu, bukan jalur kertas.",tags:["tisu","kertas","kotor","kamar mandi"]},{id:"res-popok",name:"Popok Sekali Pakai",category:"residu",emoji:"🧷",description:"Popok bekas yang berisi campuran gel penyerap dan kotoran.",fact:"Popok sekali pakai terdiri dari banyak lapisan bahan (plastik, gel, pulp) yang praktis tidak bisa dipisahkan di fasilitas biasa.",handling:"Buang isinya ke toilet bila memungkinkan, gulung dan bungkus rapat, lalu masukkan ke tempat sampah residu.",difficulty:1,reason:"Popok tercampur kotoran dan berlapis banyak bahan sehingga masuk residu.",wrongHint:"Popok bukan organik meski mengandung sisa biologis, dan jelas tidak bisa didaur ulang bersama plastik bersih.",tags:["popok","bayi","residu","campuran"]},{id:"res-sachet",name:"Bungkus Sachet Multilayer (kopi/snack)",category:"residu",emoji:"🍬",description:"Kemasan tipis berlapis aluminium-plastik bekas kopi sachet, mi instan, atau snack.",fact:"Kemasan multilayer menyatukan beberapa bahan sekaligus sehingga pemisahannya mahal; banyak fasilitas lokal belum menerimanya.",handling:"Kumpulkan dalam satu wadah (beberapa komunitas membuat ecobrick), lalu buang ke residu bila tidak ada jalur khusus.",difficulty:3,reason:"Kemasan berlapis yang tidak diterima fasilitas daur ulang setempat termasuk residu dalam konteks permainan ini.",wrongHint:"Meskipun berbahan plastik, sachet berlapis sulit dipisahkan sehingga tidak otomatis masuk jalur daur ulang.",tags:["sachet","plastik","multilayer","snack","kopi"]},{id:"res-styrofoam",name:"Kotak Styrofoam Bekas Makanan",category:"residu",emoji:"🍱",description:"Wadah makan styrofoam yang masih berminyak dan beremah.",fact:"Styrofoam (EPS) sebagian besar isinya udara; hanya sedikit fasilitas yang men   <body>
    <div id="root">
      <main class="boot-screen" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">♻</div>
          <h1>EcoSort sedang dimuat</h1>
          <p>Menyiapkan permainan, sebentar ya…</p>
          <div class="boot-bar" aria-hidden="true"><span></span></div>

          <!--
            Petunjuk ini hanya muncul bila aplikasi benar-benar gagal dimuat
            (misalnya file sumber index.html dibuka langsung tanpa build).
            Saat berjalan normal, React menggantikan seluruh blok ini.
          -->
          <details id="boot-help" hidden>
            <summary>EcoSort belum tampil? Buka versi siap pakai</summary>
            <ol>
              <li>Untuk pengembangan, jalankan <code>npm install</code> lalu <code>npm run dev</code>.</li>
              <li>Untuk file siap pakai, jalankan <code>npm run build</code> lalu buka <code>dist/index.html</code>.</li>
              <li>Versi online selalu terbaru di <span id="boot-online-link">folder <code>docs/</code></span>.</li>
            </ol>
          </details>
        </div>
      </main>
      <noscript>
        <p class="boot-screen">EcoSort membutuhkan JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</p>
      </noscript>
    </div>
    <script>
      /* ----------------------------------------------------------------------
         1) Bila halaman SUMBER ini dibuka dari GitHub Pages, langsung arahkan ke
            hasil build di folder docs/ supaya pengunjung tidak melihat layar
            "sedang dimuat" selamanya. Hasil build tidak punya skrip
            src/main.tsx (sudah di-inline), jadi salinan build tidak redirect.
         ---------------------------------------------------------------------- */
      (function () {
        var isSourceFile = !!document.querySelector('script[src*="src/main.tsx"]');

        // Tautan ke versi online hanya masuk akal dari file sumber.
        if (isSourceFile) {
          var slot = document.getElementById("boot-online-link");
          if (slot) slot.innerHTML = '<a href="docs/">hasil build EcoSort</a>';
        }

        if (isSourceFile && location.hostname.endsWith(".github.io")) {
          location.replace("docs/");
        }
      })();

      /* ----------------------------------------------------------------------
         2) Bila setelah 4 detik React belum mengambil alih #root, tampilkan
            petunjuk singkat (umumnya karena file dibuka tanpa build).
         ---------------------------------------------------------------------- */
      setTimeout(function () {
        var boot = document.querySelector("#root .boot-screen");
        var help = document.getElementById("boot-help");
        if (boot && help) help.hidden = false;
      }, 4000);
    </script>
  </body>
</html>
